spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  mail:
    # Tests never connect; this just lets the JavaMailSender bean be created.
    host: localhost
    port: 2525
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

app:
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW9ubHktMzJieXRlcyE=
    access-token-expiration: 15m
    refresh-token-expiration: 7d
  registration:
    allowed-email-domain: seu.edu.bd
  frontend-url: http://localhost:5173
  orders:
    auto-complete-after: 72h
  rate-limit:
    enabled: false   # the rate-limit tests switch it on
    trusted-proxies: 1
  cache:
    enabled: false   # most tests change data directly; the cache tests switch it on
  notifications:
    async: false
  scheduling:
    enabled: false
  mail:
    from: no-reply@seu.edu.bd
  otp:
    expiration: 10m
    max-attempts: 5
    resend-cooldown: 60s
  cloudinary:
    # Dummy values; tests mock ImageStorageService or the Cloudinary client and never call the API.
    cloud-name: test-cloud
    api-key: test-key
    api-secret: test-secret
    folder: test
  stripe:
    # Dummy key; tests mock CheckoutGateway or build params without calling Stripe.
    secret-key: sk_test_dummy
    webhook-secret: whsec_test_secret
  assistant:
    enabled: true
    gateway: fake      # tests replace AssistantGateway with a mock where they need to see the prompt
    api-key:
    model: test-model
    base-url: http://localhost:1
    search-enabled: false
    verdict-enabled: true   # the verdict maths has tests; production keeps it off
    thinking-level: low
    per-user-per-hour: 0    # unlimited, as in production; the rate-limit tests set their own
    global-per-day: 0
    timeout: 2s
    max-image-bytes: 4194304
    bdt-per-usd: 120
    bangladesh-domains: bikroy.com,daraz.com.bd,startech.com.bd,ryans.com,techlandbd.com,pickaboo.com
  payments:
    currency: usd
    fee:
      threshold: 20.00
      low-rate: 0.03
      high-rate: 0.05
      minimum-cents: 50
    posting-fee:
      enabled: false   # most tests create listings through the API and expect them live; the posting-fee tests turn it on
      threshold: 5.00
    reservation-duration: 48h
    success-url: http://localhost:3000/payments/success?session_id={CHECKOUT_SESSION_ID}
    cancel-url: http://localhost:3000/payments/cancel
    feature-duration: 7d
